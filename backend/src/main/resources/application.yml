server:
  # 8080 常被本机其它服务占用（DSH 控制台就占着），默认走 8081
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: carerelay
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:carerelay}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 40MB
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 医养接力站配置：AI 全部走 OpenAI 兼容协议，换厂商只改环境变量
cr:
  jwt:
    secret: ${CR_JWT_SECRET:dev-only-secret-please-override-0123456789}
    ttl-hours: ${CR_JWT_TTL_HOURS:72}
  ai:
    base-url: ${CR_AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${CR_AI_API_KEY:}
    model: ${CR_AI_MODEL:deepseek-chat}
    embedding-base-url: ${CR_AI_EMBEDDING_BASE_URL:}
    embedding-api-key: ${CR_AI_EMBEDDING_API_KEY:}
    embedding-model: ${CR_AI_EMBEDDING_MODEL:}
    image-base-url: ${CR_AI_IMAGE_BASE_URL:}
    image-api-key: ${CR_AI_IMAGE_API_KEY:}
    image-model: ${CR_AI_IMAGE_MODEL:}
    timeout-seconds: ${CR_AI_TIMEOUT_SECONDS:30}

logging:
  level:
    root: info
    com.carerelay: debug
