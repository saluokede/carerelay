# =============================================================
# 医养接力站 · 一键部署编排
# 用法（在 deploy/ 目录）：
#   cp ../.env.example .env   # 填好密钥
#   docker compose up -d --build
# 访问：http://localhost （前端）｜ http://localhost:8080/api/v1/health （后端）
# 说明：MySQL 结构由 Flyway 在 backend 启动时自动建表，无需手工导入 SQL。
# =============================================================
name: carerelay

services:
  mysql:
    image: mysql:8.0
    container_name: yj-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yj_root_pwd}
      MYSQL_DATABASE: ${DB_NAME:-carerelay}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - yj-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-yj_root_pwd}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: yj-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-carerelay}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yj_root_pwd}
      CR_AI_BASE_URL: ${CR_AI_BASE_URL:-https://api.deepseek.com/v1}
      CR_AI_API_KEY: ${CR_AI_API_KEY:-}
      CR_AI_MODEL: ${CR_AI_MODEL:-deepseek-chat}
      CR_AI_EMBEDDING_BASE_URL: ${CR_AI_EMBEDDING_BASE_URL:-}
      CR_AI_EMBEDDING_API_KEY: ${CR_AI_EMBEDDING_API_KEY:-}
      CR_AI_EMBEDDING_MODEL: ${CR_AI_EMBEDDING_MODEL:-}
      CR_AI_IMAGE_BASE_URL: ${CR_AI_IMAGE_BASE_URL:-}
      CR_AI_IMAGE_API_KEY: ${CR_AI_IMAGE_API_KEY:-}
      CR_AI_IMAGE_MODEL: ${CR_AI_IMAGE_MODEL:-}
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    volumes:
      - yj-uploads:/app/uploads

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: yj-web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  yj-mysql-data:
  yj-uploads:
